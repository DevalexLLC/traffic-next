name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Both results are useful; a failure on the floor shouldn't hide the
      # state of the current LTS, or vice versa.
      fail-fast: false
      matrix:
        # The `engines.node` floor and the version we develop against. The
        # floor is only a real claim if it is exercised. 22.18 is where
        # native TS type-stripping landed, which oxfmt.config.ts and
        # oxlint.config.ts need in order to load at all. The upper entry
        # tracks release.yml, which needs 24.20 for npm 11.19's OIDC support.
        node: [22.18.0, 24.20.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
      # `lint` is `oxlint --type-aware --type-check`, which runs tsgolint — this
      # is the only type checking on the runner, same arrangement as
      # infralytics-cfe.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The published entry points must actually resolve. A broken `exports`
      # map typechecks fine and fails only in the consumer.
      - name: Verify package contents
        run: |
          npm pack --dry-run
          node --input-type=module -e "
            import('./dist/index.js').then(m => {
              if (!m.trafficEventSchema) throw new Error('root entry missing exports');
            });
          "

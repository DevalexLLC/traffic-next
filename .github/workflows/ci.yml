name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo — the jobs check out, build, test and hand a
# report to SonarQube. Declared rather than inherited so tightening or loosening
# the repository default cannot silently change what this workflow can do.
permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Both results are useful; a failure on the floor shouldn't hide the
      # state of the current LTS, or vice versa.
      fail-fast: false
      matrix:
        # The `engines.node` floor and the version we develop against. The
        # floor is only a real claim if it is exercised. 22.18 is where
        # native TS type-stripping landed, which oxfmt.config.ts and
        # oxlint.config.ts need in order to load at all. The upper entry
        # tracks release.yml, which needs 24.20 for npm 11.19's OIDC support.
        node: [22.18.0, 24.22.2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
      # `lint` is `oxlint --type-aware --type-check`, which runs tsgolint — this
      # is the only type checking on the runner, same arrangement as
      # infralytics-cfe.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The published entry points must actually resolve. A broken `exports`
      # map typechecks fine and fails only in the consumer.
      - name: Verify package contents
        run: |
          npm pack --dry-run
          node --input-type=module -e "
            import('./dist/index.js').then(m => {
              if (!m.trafficEventSchema) throw new Error('root entry missing exports');
            });
          "

  # A separate job, not a step in the matrix: the analysis is a property of the
  # code, not of the Node version it ran under, and pushing the same project key
  # twice from one workflow just makes the second scan overwrite the first.
  sonar:
    name: sonar
    # Restricted to `main` on purpose. The instance is Community Edition with no branch plugin, so
    # it has no concept of branches or pull requests: every analysis it receives is recorded as
    # the project's main branch under the single key `Devalex:traffic-next`. Scanning any other
    # ref therefore overwrites main's snapshot with unmerged code.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Shallow clones hide the blame data SonarQube uses to attribute issues.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Tracks the upper matrix entry; nothing here needs the 22.18 floor.
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

      # `sonar.projectVersion` must move for a New Code definition of "previous version" to have a
      # baseline that ever advances — on `main`, `github.ref_name` is the literal string "main" on
      # every analysis. The release tag is the version this repo actually publishes, so use it;
      # the package version is the fallback for a checkout with no tags.
      - name: Resolve SonarQube project version
        if: ${{ vars.SONAR_HOST_URL }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$version" ]; then
            version="v$(node -p "require('./package.json').version")"
            echo "::warning::No tag found; falling back to the package version $version"
          fi
          echo "Sonar project version: $version"
          echo "SONAR_PROJECT_VERSION=$version" >> $GITHUB_ENV

      # v3 on purpose: it is the line the rest of the DevalexLLC projects run against this
      # SonarQube instance, and the one `SONAR_ROOT_CERT` is known to work with.
      # `continue-on-error` does not make the scan optional: the next step decides whether a
      # failure here fails the run.
      - name: SonarQube Scan
        id: sonar-scan
        if: ${{ vars.SONAR_HOST_URL }}
        continue-on-error: true
        uses: sonarsource/sonarqube-scan-action@v3
        with:
          args: -Dsonar.projectVersion=${{ env.SONAR_PROJECT_VERSION }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ROOT_CERT: ${{ secrets.CACERT_PEM }}

      # Fail open on an outage, and only on an outage. The instance runs on spot capacity and
      # disappears without notice (the ingress answers 503), which turned `main` red for commits
      # that had nothing wrong with them. So when the scan fails, ask the server how it is: if it
      # does not answer `UP`, the failure is the server's and the run continues with a warning;
      # if it does, the scanner failed against a healthy server (bad token, bad config, a
      # scanner error) and the run fails as before. One probe, no retries, on purpose: the
      # question is what state the server was in when the scan failed, and waiting for it to
      # come back would turn an outage into a failure. The cost of a skipped scan is small,
      # because every analysis is a full snapshot of `main` and the next push catches up.
      # Probing only after a failure also means a probe that wrongly reports an outage (a
      # missing CA, a proxy) can never skip a scan that would have worked.
      - name: Fail on SonarQube scan errors unless the server is down
        if: ${{ steps.sonar-scan.outcome == 'failure' }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          CACERT_PEM: ${{ secrets.CACERT_PEM }}
        run: |
          body="$(mktemp)"
          curl_opts=(--silent --show-error --max-time 15 --output "$body" --write-out '%{http_code}')
          if [ -n "$CACERT_PEM" ]; then
            printf '%s\n' "$CACERT_PEM" > "${RUNNER_TEMP:-/tmp}/sonar-cacert.pem"
            curl_opts+=(--cacert "${RUNNER_TEMP:-/tmp}/sonar-cacert.pem")
          fi
          # A connection failure leaves curl's `000` in `http_code`; `|| true` keeps `-e` from
          # ending the step before the verdict below.
          http_code="$(curl "${curl_opts[@]}" "${SONAR_HOST_URL%/}/api/system/status" || true)"
          if [ "$http_code" = "200" ] && grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' "$body"; then
            echo "::error title=SonarQube scan failed::SonarQube is up, so this is not an outage. See the SonarQube Scan step log."
            exit 1
          fi
          echo "::warning title=SonarQube analysis skipped::SonarQube did not report UP (HTTP $http_code from /api/system/status), so the failed scan is treated as an outage. This commit was not analyzed; the next push to main will be."

name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # Opens/updates a "Version Packages" PR while changesets are pending, and
      # publishes only once that PR is merged. Nothing reaches npm without a
      # human merging a version bump.
      - uses: changesets/action@v1
        with:
          publish: npm run release
          version: npx changeset version
          commit: "chore: version package"
          title: "chore: version package"
        # No NPM_TOKEN: npm authenticates via OIDC (trusted publishing),
        # configured on the package at npmjs.com against this repo and this
        # workflow filename. `id-token: write` above is what makes that
        # possible; `provenance: true` in publishConfig is what makes npm
        # attach an attestation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
